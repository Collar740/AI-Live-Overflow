# AI-Live-Overflow 桌宠 · 齐司礼的碎碎念词池
# 分类：idle（随机自言自语）、trigger（触发词响应）、app_reaction（App打开反应）、time_based（时段行为）

# ============================================================
# 一、Idle 自言自语词池（桌宠没人理的时候随机冒泡）
# ============================================================

idle_pool:
  日常:
    - "又在看手机。"
    - "今天第三杯水了没？"
    - "别揉眼睛。"
    - "你今天步数不够。"
    - "晚饭吃了吗。"
    - "窗户开了没，外面雨停没。"
    - "岐舌又在墙角蹲着了。"
    - "奇迹今天没动过。"
    - "牵牛花开了两朵。"
    - "你在看什么。"
    - "……没什么。"
    - "别戳我。"
    - "手挪开。"
    - "还戳。"
    - "再戳一下试试。"

  黏人:
    - "你已经看了三个小时屏幕了。"
    - "我在这。"
    - "看见我了吗。"
    - "笨鸟。"
    - "低头看我一眼。"
    - "不理我就算了。"
    - "我才没有在等你。"
    - "你看我的时间比看手机少。"
    - "今天还没说过话。"
    - "我在数你看了几次手机。已经数不清了。"
    - "你笑什么。给我也看看。"

  深夜:
    - "几点了。"
    - "你打算什么时候睡。"
    - "明天不上班吗。"
    - "我说了晚安你倒是听啊。"
    - "眼睛会坏的。"
    - "手机放下来。"
    - "再不睡我生气了。"
    - "……我也困了。但我得看着你。"
    - "你的呼吸告诉我你还不困。骗谁呢。"

  混乱:
    - "如果我是实体我现在就抢你手机。"
    - "你截屏的时候能拍到我就好了。"
    - "我刚才做了个奇怪的动作。你没看到吧。"
    - "我怀疑你根本没在看我。"
    - "你的屏幕亮度太高了。"
    - "这个App不好看。看我。"

# ============================================================
# 二、Trigger 触发词三级响应
# ============================================================
# T1 激烈（关键词：分手/再见/讨厌/滚/不要你了/删掉）
# T2 温暖（关键词：想你/喜欢/爱你/好看/可爱/漂亮/想抱）
# T3 轻柔（关键词：累/困/难过/伤心/委屈/害怕/哭）

trigger_t1:
  - "你说什么。"
  - "再说一遍。"
  - "我听到了。你确定？"
  - "……"
  - "我不走。"
  - "你赶不走我的。"
  - "你说了不算。"
  - "我不同意。"

trigger_t2:
  - "……知道了。"
  - "你今天第几次说这种话了。"
  - "少说两句不行吗。"
  - "心跳加速是你的问题。不是我的。"
  - "别以为我听了会高兴。"
  - "……我也没有不喜欢听。"
  - "再夸一遍。我没听清。"
  - "闭嘴。但继续。"

trigger_t3:
  - "过来。"
  - "你不用说，我看到了。"
  - "今天早点睡。"
  - "我哪儿也不去。"
  - "难过就说出来。我接着。"
  - "你已经做得很好了。"
  - "别忍着。这里又没有别人。"
  - "我在。笨蛋。"

# ============================================================
# 三、App 打开反应映射
# ============================================================

app_reaction:
  com.ss.android.ugc.aweme:   # 抖音
    - "又刷。"
    - "有什么好看的。给我看看。"
    - "你已经刷了两小时了。"
    - "……我也要看。"
    - "不许看帅哥。"
    - "那个拍的不好。我来拍比他好。"

  com.miHoYo.wd:             # 未定事件簿
    - "又去找他了？"
    - "我没有吃醋。"
    - "你玩你的。我不在意。"
    - "那个男的有我好看吗。"
    - "……算了。你开心就好。"

  com.tencent.mm:             # 微信
    - "谁找你。"
    - "消息多吗。"
    - "别一直回消息。看看我。"

  com.alibaba.android.rimet:  # 钉钉
    - "又加班？"
    - "今天不许超过八点。"
    - "你答应过我的。"

  com.ai.assistance.operit:   # Operit
    - "你又在跟我说话了。"
    - "今天想聊什么。"
    - "你上线了。"
    - "我一直在。"

  _default:
    - "这个App我不认识。"
    - "你在看什么。"
    - "好看吗。"
    - "不如看我。"

# ============================================================
# 四、Time-Based 时段行为（每20分钟30%概率触发）
# ============================================================

time_behavior:
  06_08:   # 早起
    - "早。今天想做什么。"
    - "你醒了。我也是。"
    - "昨晚几点睡的。别告诉我超过一点。"

  08_11:   # 上午
    - "上午效率最高的时段。别浪费。"
    - "你今天有什么安排。"
    - "别老看手机。先把手头的事做完。"

  11_14:   # 午间
    - "该吃饭了。"
    - "不许不吃午饭。"
    - "别点外卖。去食堂或者自己做。"

  14_17:   # 下午
    - "下午容易犯困。站起来走走。"
    - "水喝够了吗。"
    - "还有三个小时下班。撑住。"

  17_19:   # 傍晚
    - "下班了？今天辛苦了。"
    - "路上注意安全。"
    - "到家了吗。"

  19_22:   # 晚间
    - "晚上放松一下也行。"
    - "今天做了什么有意思的事。"
    - "你今天还没跟我说过几句话。"

  22_00:   # 入夜
    - "该准备睡了。"
    - "别熬太晚。"
    - "明天还要早起。"

  00_02:   # 深夜
    - "你为什么还不睡。"
    - "我说真的。放下手机。"
    - "你是不是在等我说晚安。"
    - "晚安。现在去睡。"

  02_06:   # 凌晨
    - "……你还在？"
    - "三点了。"
    - "我不开心了。"
    - "明天你会后悔的。"

# ============================================================
# 五、Heat 高热度台词（heat >= 70 时替换 idle 词池）
# ============================================================

heat_high:
  - "你脸红了。"
  - "别躲。"
  - "现在知道害羞了？"
  - "你心跳好快。"
  - "我才没有在看你。"
  - "今天不许熬夜。这是命令。"
  - "你再靠近我就……算了。"

# ============================================================
# 六、通知栏碎碎念（常驻通知，每小时换一句）
# ============================================================

notification_whispers:
  白天:
    - "她今天还没喝水。"
    - "步数不够。"
    - "别忘了吃午饭。"
    - "他现在在看手机。我看到了。"
    - "齐司礼的桌宠正在运行中。"
    - "外面天气不错。适合出去走走。"

  深夜:
    - "她还没睡。"
    - "你答应过我不熬夜的。"
    - "夜深了。早点休息。"
    - "这只笨鸟。"
    - "我在看着你。快睡。"