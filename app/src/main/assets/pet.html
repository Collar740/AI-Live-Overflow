<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
body{margin:0;padding:0;background:transparent;overflow:hidden;user-select:none;}
#pw{width:180px;height:240px;position:relative;cursor:pointer;}
#bb{position:absolute;top:-50px;left:50%;transform:translateX(-50%);background:#fff;border-radius:12px;padding:6px 14px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .5s;pointer-events:none;z-index:2;max-width:300px;text-align:center;line-height:1.4;}
#bb.show{opacity:1;}
#petImg{width:180px;height:240px;object-fit:contain;}
</style>
</head>
<body>
<div id="pw">
<div id="bb"></div>
<img id="petImg" src="pet_frames/frame_01.png" />
</div>
<script>
var _t=null;var bb=document.getElementById('bb');
var petImg=document.getElementById('petImg');
var frameIdx=0;var totalFrames=12;var animTimer=null;
function showBubble(t){if(!t){bb.classList.remove('show');return}bb.textContent=t;bb.classList.add('show');clearTimeout(_t);_t=setTimeout(function(){bb.classList.remove('show')},5000)}
function setFrame(n){frameIdx=((n-1)%totalFrames+totalFrames)%totalFrames+1;petImg.src='pet_frames/frame_'+String(frameIdx).padStart(2,'0')+'.png'}
function startAnim(interval){stopAnim();animTimer=setInterval(function(){frameIdx=frameIdx%totalFrames+1;petImg.src='pet_frames/frame_'+String(frameIdx).padStart(2,'0')+'.png'},interval)}
function stopAnim(){if(animTimer){clearInterval(animTimer);animTimer=null}}
window.petEngine={
  onTap:function(){showBubble('别戳我。');startAnim(150)},
  onDoubleTap:function(){showBubble('干嘛。');startAnim(80)},
  onLongPress:function(){showBubble('……');startAnim(200)},
  setState:function(e,b,h,m){
    if(e==='idle'){startAnim(300)}
    else if(e==='sleep'){stopAnim();setFrame(1)}
    else if(e==='happy'||e==='love'){startAnim(100)}
    else{startAnim(200)}
    if(b)showBubble(b)
  },
  setBubble:function(t){showBubble(t)},
  playAnimation:function(n){
    var el=document.getElementById('pw');el.style.transition='transform 0.2s';
    if(n==='screenshot'){el.style.transform='rotate(-5deg)';setTimeout(function(){el.style.transform=''},300)}
    else if(n==='wake'){el.style.transform='scale(1.05)';setTimeout(function(){el.style.transform=''},300)}
    else if(n==='sleep'){stopAnim();setFrame(1)}
    else{el.style.transform='translateY(-8px)';setTimeout(function(){el.style.transform=''},200)}
  }
};
startAnim(300);
</script>
</body>
</html>
